[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campus-reading-mcp"
version = "1.0.0"
description = "A three-tool campus reading-list MCP toolkit for EECE 503P/798S"
requires-python = ">=3.12"
dependencies = ["fastmcp", "openai-agents", "python-dotenv"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["campus_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
